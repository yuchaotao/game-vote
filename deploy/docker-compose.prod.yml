# Production overrides, layered on ../docker-compose.yml by deploy/deploy.sh:
#   docker compose -p game-vote-prod -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile app ...
#
# - Separate compose project => separate volumes/database from the dev stack.
# - Postgres and Redis are not published on the host (dev already uses 5432/6379).
# - The web app listens on WEB_PORT (default 8080) for the reverse proxy on CT 101.
services:
  postgres:
    ports: !reset []

  redis:
    ports: !reset []

  web:
    image: game-vote:prod
    ports: !override
      - "${WEB_PORT:-8080}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000' + (process.env.BASE_PATH || '') + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3

  worker:
    image: game-vote:prod
