name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e (${{ matrix.base_path || 'site root' }})
    strategy:
      fail-fast: false
      matrix:
        # "" runs the full suite at the site root; a sub-path runs e2e/base-path.spec.ts
        base_path: ["", "/game-vote"]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamevote
          POSTGRES_PASSWORD: gamevote
          POSTGRES_DB: gamevote
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gamevote" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ["1025:1025", "8025:8025"]
    env:
      APP_URL: http://localhost:3000${{ matrix.base_path }}
      BASE_PATH: ${{ matrix.base_path }}
      DATABASE_URL: postgresql://gamevote:gamevote@localhost:5432/gamevote
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      SMTP_HOST: localhost
      SMTP_PORT: "1025"
      MAIL_FROM: Game Vote <noreply@gamevote.local>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report${{ matrix.base_path && '-subpath' || '' }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  image:
    name: Production image
    # Built and smoke-tested on every PR; pushed only from main, once every check
    # and e2e run has passed. deploy/deploy.sh pulls the sha-<commit> tag.
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gamevote
          POSTGRES_PASSWORD: gamevote
          POSTGRES_DB: gamevote
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U gamevote" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          # Must match BASE_PATH in deploy/.env.prod (deploy.sh checks).
          build-args: BASE_PATH=/game-vote
          tags: game-vote:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker image ls game-vote:ci --format 'Image size: {{.Size}}'
          env=(-e DATABASE_URL=postgresql://gamevote:gamevote@localhost:5432/gamevote
               -e REDIS_URL=redis://localhost:6379
               -e SESSION_SECRET=ci-only-session-secret-0123456789abcdef
               -e APP_URL=http://localhost:3000/game-vote)
          # Web: migrations + server.
          docker run -d --name web --network host "${env[@]}" game-vote:ci
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:3000/game-vote/api/health && break
            sleep 2
          done
          curl -fsS http://localhost:3000/game-vote/api/health
          curl -fsS -o /dev/null http://localhost:3000/game-vote
          # Worker bundle: one job, then the long-running worker starts.
          docker run --rm --network host "${env[@]}" game-vote:ci node dist/worker/run-once.js heartbeat
          docker run -d --name worker --network host "${env[@]}" game-vote:ci node dist/worker/index.js
          sleep 5
          docker logs worker 2>&1 | grep -q "\[worker\] started"
      - name: Logs on failure
        if: failure()
        run: docker logs web; docker logs worker
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          build-args: BASE_PATH=/game-vote
          tags: |
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
            ghcr.io/${{ github.repository }}:main
          cache-from: type=gha
