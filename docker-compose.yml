# Development: `docker compose --profile dev up -d` starts postgres + redis + mailpit; run the app with `npm run dev` / `npm run worker:dev`.
# Full stack in containers: `docker compose --profile app up -d --build`.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gamevote}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gamevote}
      POSTGRES_DB: ${POSTGRES_DB:-gamevote}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Dev mail catcher: SMTP on :1025, web UI + API on :8025.
  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "8025:8025"

  web:
    profiles: ["app"]
    build:
      context: .
      args:
        BASE_PATH: ${BASE_PATH:-}
    image: game-vote:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gamevote}:${POSTGRES_PASSWORD:-gamevote}@postgres:5432/${POSTGRES_DB:-gamevote}
      REDIS_URL: redis://redis:6379
    command: ["sh", "-c", "npx prisma migrate deploy && npm run start"]
    ports:
      - "3000:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    profiles: ["app"]
    image: game-vote:local
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-gamevote}:${POSTGRES_PASSWORD:-gamevote}@postgres:5432/${POSTGRES_DB:-gamevote}
      REDIS_URL: redis://redis:6379
    command: ["npm", "run", "worker"]
    depends_on:
      web: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
